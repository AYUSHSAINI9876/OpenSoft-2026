<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <title>Oak Capital — High-Frequency Trading Simulator</title>
    <meta
      name="description"
      content="Oak Capital is a real-time trading platform with a C++ matching engine, live order books, OHLCV charting, and automated strategy bots."
    />
    <meta name="theme-color" content="#0B0E11" />
    <meta name="color-scheme" content="dark" />

    <!-- Social preview -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Oak Capital — High-Frequency Trading Simulator" />
    <meta
      property="og:description"
      content="Trade a simulated exchange powered by a C++ matching engine, live WebSocket market data, and automated strategy bots."
    />
    <meta property="og:image" content="/branding/oak-capital-logo.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <!--
      The app boots into a dark shell, so painting the background before the JS
      bundle arrives avoids a white flash on first load.
    -->
    <style>
      html,
      body,
      #root {
        margin: 0;
        background-color: #0b0e11;
      }
      #app-splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #0b0e11;
      }
      #app-splash::after {
        content: '';
        width: 34px;
        height: 34px;
        border-radius: 9999px;
        border: 2px solid rgba(255, 255, 255, 0.1);
        border-top-color: #00c076;
        animation: app-splash-spin 0.7s linear infinite;
      }
      @keyframes app-splash-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #app-splash::after {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Removed by React on first render. -->
      <div id="app-splash" role="status" aria-label="Loading Oak Capital"></div>
    </div>
    <noscript>
      <div style="padding: 2rem; color: #d9dee3; font-family: system-ui, sans-serif">
        Oak Capital requires JavaScript to stream live market data. Please enable it and reload.
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
